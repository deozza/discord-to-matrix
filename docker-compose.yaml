services:
  discord-to-matrix:
    container_name: discord-to-matrix
    image: golang:latest
    volumes:
      - ./app:/go/src
    tty: true
    environment:
      DISCORD_BACKUP_DIR: ${DISCORD_BACKUP_DIR}
      MATRIX_SERVER_ADDRESS: ${MATRIX_SERVER_ADDRESS}
      MATRIX_USERNAME: ${MATRIX_USERNAME}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD}
