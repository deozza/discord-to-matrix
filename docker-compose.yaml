services:
  discord-to-matrix:
    container_name: discord-to-matrix
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/var/www/html
      - /path/to/discordchatexporter/folder:/var/www/html/discord
      - ./php.ini:/usr/local/etc/php/php.ini
    working_dir: /var/www/html
    command: composer install; php -f index.php
